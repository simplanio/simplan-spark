# Test configuration demonstrating Option 1: HOCON variable substitution with idpsSecret
# 
# This configuration shows how to:
# 1. Define secrets in system.config using idpsSecret()
# 2. Reference those secrets in emitter config using ${...} substitution
# 3. The framework resolves idpsSecret during config loading
# 4. HOCON substitution happens automatically
# 5. Emitters receive the already-resolved secret values

simplan {
  application {
    name = "IdpsSecretEmitterTest"
    asset = "test-asset-123"
    environment = "test"
    orchestrator = "test"
    source = "test"
  }

  system {
    config {
      # IDPS configuration (mocked in test)
      idps {
        endpoint = "mock-idps-endpoint"
        policy_id = "mock-policy-id"
      }

      # Spark configuration for test
      spark {
        properties {
          "spark.master" = "local[2]"
          "spark.eventLog.enabled" = false
          "spark.sql.warehouse.dir" = /tmp/spark-warehouse
        }
      }

      # Define Kafka secrets in system config
      # These will be resolved by IdpsSupport when the config is loaded
      kafka {
        # This idpsSecret() call will be resolved to the actual secret value
        password = idpsSecret(kafka/test-password)
        saslConfig = idpsSecret(kafka/test-sasl-config)
        bootstrapServers = "localhost:9092"
      }
    }
  }

  # Emitter configuration using HOCON variable substitution
  # The ${simplan.system.config.kafka.password} references are resolved by HOCON
  # At that point, idpsSecret() has already been resolved to the actual value
  emitters {
    testKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = true
      config = {
        producerConfig {
          # Reference the resolved secret using HOCON substitution
          "bootstrap.servers" = ${simplan.system.config.kafka.bootstrapServers}
          "sasl.jaas.config" = ${simplan.system.config.kafka.saslConfig}
          "key.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "value.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "security.protocol" = "SASL_SSL"
          "sasl.mechanism" = "PLAIN"
        }
        topic = "test-topic"
        maxRetries = 3
        retryInterval = 1000
        isBlocking = false
      }
    }

    # Example with multiple secret references
    advancedKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = true
      config = {
        producerConfig {
          "bootstrap.servers" = ${simplan.system.config.kafka.bootstrapServers}
          # You can use multiple secrets in the same config
          "sasl.jaas.config" = ${simplan.system.config.kafka.saslConfig}
          "ssl.keystore.password" = ${simplan.system.config.kafka.password}
          "key.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "value.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
        }
        topic = "advanced-topic"
        maxRetries = 5
        retryInterval = 2000
        isBlocking = true
      }
    }

    # Example showing you can also use direct values alongside substitutions
    mixedConfigEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = false
      config = {
        producerConfig {
          # Mix of substituted and direct values
          "bootstrap.servers" = ${simplan.system.config.kafka.bootstrapServers}
          "sasl.jaas.config" = ${simplan.system.config.kafka.saslConfig}
          # Direct value (not from system config)
          "acks" = "all"
          "retries" = "3"
          "key.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "value.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
        }
        topic = "mixed-topic"
        maxRetries = 3
        retryInterval = 1000
      }
    }
  }
}

