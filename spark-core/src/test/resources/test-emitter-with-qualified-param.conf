# Test configuration demonstrating HOCON variable substitution for emitter configs
#
# This configuration shows how to:
# 1. Define values (including qualified params) in system.config as flat strings
#    (SystemConfig.config is a Map[String, String] - every key must be a plain string)
# 2. Reference those values in emitter config using ${...} substitution
# 3. The framework resolves qualified params during config loading
# 4. HOCON substitution happens automatically
# 5. Emitters receive the already-resolved values
#
# NOTE: This example uses plain strings. When using IdpsSupport trait,
# you can use idpsSecret() in system.config and it will be resolved automatically.
#
# NOTE: emitters.<name>.config is a String field (SimplanEmitterConfig.config: String),
# so it must be a JSON string. HOCON substitutions only resolve outside of quoted
# literals, so each substitution is spliced in via quoted-string concatenation:
#   "...\"" ${some.path} "\"..."

simplan {
  application {
    name = "EmitterConfigWithQualifiedParamTest"
    asset = "test-asset-123"
    environment = "test"
    orchestrator = "test"
    source = "test"
  }

  system {
    config {
      # Spark configuration for test - must be a JSON string (decoded via getSystemConfigAs[SparkSystemConfiguration])
      spark = "{\"properties\":{\"spark.master\":\"local[2]\",\"spark.eventLog.enabled\":\"false\",\"spark.sql.warehouse.dir\":\"/tmp/spark-warehouse\"}}"

      # Define Kafka configuration values as flat strings in system config
      # In production with IdpsSupport, you would use:
      # kafkaPassword = idpsSecret(kafka/my-password)
      # kafkaSaslConfig = idpsSecret(kafka/sasl-config)
      kafkaBootstrapServers = "localhost:9092"
      # These would be idpsSecret() calls in production
      kafkaPassword = "test-password-value"
      kafkaSaslConfig = "test-sasl-config-value"
    }
  }

  # Emitter configuration using HOCON variable substitution
  # The ${simplan.system.config.kafka.*} references are resolved by HOCON
  # If idpsSecret() is used in system.config, it gets resolved first, then substituted here
  emitters {
    testKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = true
      config = "{\"producerConfig\":{\"bootstrap.servers\":\""${simplan.system.config.kafkaBootstrapServers}"\",\"sasl.jaas.config\":\""${simplan.system.config.kafkaSaslConfig}"\",\"key.serializer\":\"org.apache.kafka.common.serialization.StringSerializer\",\"value.serializer\":\"org.apache.kafka.common.serialization.StringSerializer\",\"security.protocol\":\"SASL_SSL\",\"sasl.mechanism\":\"PLAIN\"},\"topic\":\"test-topic\",\"maxRetries\":3,\"retryInterval\":1000,\"isBlocking\":false}"
    }

    # Example showing multiple secrets can be referenced
    advancedKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = false
      config = "{\"producerConfig\":{\"bootstrap.servers\":\""${simplan.system.config.kafkaBootstrapServers}"\",\"sasl.jaas.config\":\""${simplan.system.config.kafkaSaslConfig}"\",\"ssl.keystore.password\":\""${simplan.system.config.kafkaPassword}"\",\"key.serializer\":\"org.apache.kafka.common.serialization.StringSerializer\",\"value.serializer\":\"org.apache.kafka.common.serialization.StringSerializer\"},\"topic\":\"advanced-topic\",\"maxRetries\":5,\"retryInterval\":2000,\"isBlocking\":true}"
    }
  }
}

