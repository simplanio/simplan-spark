# Test configuration demonstrating HOCON variable substitution for emitter configs
# 
# This configuration shows how to:
# 1. Define values (including qualified params) in system.config
# 2. Reference those values in emitter config using ${...} substitution
# 3. The framework resolves qualified params during config loading
# 4. HOCON substitution happens automatically
# 5. Emitters receive the already-resolved values
#
# NOTE: This example uses plain strings. When using IdpsSupport trait,
# you can use idpsSecret() in system.config and it will be resolved automatically.

simplan {
  application {
    name = "EmitterConfigWithQualifiedParamTest"
    asset = "test-asset-123"
    environment = "test"
    orchestrator = "test"
    source = "test"
  }

  system {
    config {
      # Spark configuration for test
      spark {
        properties {
          "spark.master" = "local[2]"
          "spark.eventLog.enabled" = false
          "spark.sql.warehouse.dir" = /tmp/spark-warehouse
        }
      }

      # Define Kafka configuration in system config
      # In production with IdpsSupport, you would use:
      # password = idpsSecret(kafka/my-password)
      # saslConfig = idpsSecret(kafka/sasl-config)
      kafka {
        bootstrapServers = "localhost:9092"
        # These would be idpsSecret() calls in production
        password = "test-password-value"
        saslConfig = "test-sasl-config-value"
      }
    }
  }

  # Emitter configuration using HOCON variable substitution
  # The ${simplan.system.config.kafka.*} references are resolved by HOCON
  # If idpsSecret() is used in system.config, it gets resolved first, then substituted here
  emitters {
    testKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = true
      config = {
        producerConfig {
          # Reference the config values using HOCON substitution
          # In production these would contain resolved idpsSecret values
          "bootstrap.servers" = ${simplan.system.config.kafka.bootstrapServers}
          "sasl.jaas.config" = ${simplan.system.config.kafka.saslConfig}
          "key.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "value.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "security.protocol" = "SASL_SSL"
          "sasl.mechanism" = "PLAIN"
        }
        topic = "test-topic"
        maxRetries = 3
        retryInterval = 1000
        isBlocking = false
      }
    }

    # Example showing multiple secrets can be referenced
    advancedKafkaEmitter {
      handler = "com.intuit.data.simplan.common.emitters.KafkaEmitter"
      enabled = false
      config = {
        producerConfig {
          "bootstrap.servers" = ${simplan.system.config.kafka.bootstrapServers}
          # You can use multiple values from system config
          "sasl.jaas.config" = ${simplan.system.config.kafka.saslConfig}
          "ssl.keystore.password" = ${simplan.system.config.kafka.password}
          "key.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
          "value.serializer" = "org.apache.kafka.common.serialization.StringSerializer"
        }
        topic = "advanced-topic"
        maxRetries = 5
        retryInterval = 2000
        isBlocking = true
      }
    }
  }
}

